# Phase 4 evaluation dataset (python main.py evaluate).
#
# type:
#   answerable   - the corpus contains at least one relevant paper
#   unanswerable - nothing in the corpus answers it; the system must say
#                  "insufficient evidence" (hard: true = in the security domain,
#                  so it passes the similarity gate and tests the LLM)
#
# relevant: papers judged relevant, as stable keys (doi:/arxiv:/openalex:),
#   never paper_id (ids change when the database is rebuilt).
#   How they were judged (docs/evaluation_report.md, "Relevance judgments"):
#   pool = top-15 dense-retrieval papers + top-10 PostgreSQL full-text papers
#   for the `fts` query (scripts/build_judgment_pool.py) + a manual title scan;
#   a paper is relevant when its title/abstract shows it directly addresses
#   the question. Judged by the AI assistant (Claude) on 2026-11-02, not by a
#   domain expert - treat as silver labels.
# key_points: any-of word groups an answer is expected to mention (lexical
#   completeness proxy), taken from the relevant papers' abstracts.
# fts: the PostgreSQL tsquery used only to build the judgment pool.

