# CyberResearchAI configuration (non-secret values only; secrets live in .env)

ingestion:
  # Maximum records fetched per (source, topic) in one run. When the limit is
  # reached, the checkpoint keeps the cursor so the next run resumes there.
  max_records_per_topic: 200
  # Daily mode: first run looks back this many days; later runs start from
  # the last completed window minus an overlap (catches late-indexed papers).
  daily_initial_lookback_days: 3
  daily_overlap_days: 1
  # Backfill mode splits the historical range into windows of this many months.
  backfill_window_months: 12

http:
  timeout_seconds: 30
  max_retries: 5
  backoff_base_seconds: 2.0
  backoff_max_seconds: 60.0

sources:
  arxiv:
    enabled: true
    base_url: "https://export.arxiv.org/api/query"
    # arXiv API terms: no more than one request every three seconds.
    min_interval_seconds: 3.0
    page_size: 100
  openalex:
    enabled: true
    base_url: "https://api.openalex.org/works"
    # OpenAlex allows up to 10 requests/second; we stay well below it.
    min_interval_seconds: 0.2
    page_size: 100
  semantic_scholar:
    enabled: true
    base_url: "https://api.semanticscholar.org/graph/v1/paper/search/bulk"
    # With an API key the limit is 1 request/second; the public pool is
    # shared and often throttled, so we use a slower pace without a key.
    min_interval_seconds: 1.1
    min_interval_seconds_without_key: 3.0
    page_size: 1000

# Each topic has its own query per source, because every API has a different
# query syntax.
topics:
  network_security:
    name: "Network Security"
    arxiv: 'cat:cs.CR AND (ti:"network security" OR abs:"network security")'
    openalex: '"network security"'
    semantic_scholar: '"network security"'
  intrusion_detection:
    name: "Intrusion Detection"
    arxiv: '(ti:"intrusion detection" OR abs:"intrusion detection")'
    openalex: '"intrusion detection"'
    semantic_scholar: '"intrusion detection"'
  ai_for_cybersecurity:
    name: "AI for Cybersecurity"
    arxiv: 'cat:cs.CR AND (abs:"machine learning" OR abs:"deep learning" OR abs:"large language model")'
    openalex: '("machine learning" OR "deep learning" OR "artificial intelligence") AND (cybersecurity OR "cyber security")'
    semantic_scholar: '("machine learning" | "deep learning" | "artificial intelligence") + (cybersecurity | "cyber security")'

processing:
  # Downloaded PDFs are stored here (git-ignored, never committed).
  pdf_directory: "data/pdfs"
  max_pdf_megabytes: 30
  # A non-arXiv PDF is downloaded only when its license is in this list.
  # arXiv papers are always allowed (arXiv grants a distribution license and
  # permits programmatic access at <= 1 request / 3 s via export.arxiv.org).
  allowed_licenses: ["cc0", "public-domain", "cc-by", "cc-by-sa", "cc-by-nc", "cc-by-nc-sa", "cc-by-nd", "cc-by-nc-nd"]
  # Unknown/custom licenses ("other-oa", missing) are skipped unless enabled.
  allow_unknown_license: false
  # Politeness delay between requests to the same publisher host.
  host_min_interval_seconds: 1.0
  # Chunking: target size and overlap measured in words.
  chunk_max_words: 220
  chunk_overlap_words: 40
  # Sections excluded from chunks (bibliographies add noise to retrieval).
  skip_sections: ["References", "Bibliography", "Acknowledgments", "Acknowledgements"]

embedding:
  # 384-dimensional, fast on CPU, widely used for semantic search.
  model_name: "sentence-transformers/all-MiniLM-L6-v2"
  dimension: 384
  batch_size: 32

rag:
  # Answer generator: "claude" (Claude API, needs ANTHROPIC_API_KEY),
  # "gemini" (Gemini API, needs GEMINI_API_KEY) or
  # "ollama" (free local model; slower and less accurate). Override per run
  # with --provider. Citation validation is identical for both.
  provider: "claude"
  ollama:
    base_url: "http://127.0.0.1:11434"
    model: "qwen2.5:7b"
    # Context window in tokens. Ollama's default is small and it silently
    # cuts longer prompts, so it must fit the system prompt + 8 evidence chunks.
    num_ctx: 12288
    num_predict: 4096
    timeout_seconds: 900
  # Hosted, with a free tier. Questions and paper excerpts are sent to Google.
  # The key comes from GEMINI_API_KEY in .env.
  gemini:
    model: "gemini-2.5-flash"
    # The limit includes hidden thinking tokens.
    max_tokens: 8192
    timeout_seconds: 120
  # Claude model and reasoning effort for answer generation.
  model: "claude-opus-5-5"
  effort: "medium"
  max_tokens: 16000
  # Retrieval: fetch candidate_k nearest chunks, keep at most
  # max_chunks_per_paper per paper (diversity), then the best top_k.
  top_k: 8
  candidate_k: 40
  # Exact scan instead of the HNSW index: about 19 ms with recall 1.0 on this
  # corpus. The index takes 2 ms but loses chunks (ef_search 100: recall@40 0.946,
  # MRR 0.858 -> 0.824). Set false only when a much larger corpus makes the exact
  # scan too slow; hnsw_ef_search applies only then.
  exact_vector_search: true
  hnsw_ef_search: 200
  # Hybrid search: merge the cosine ranking with a full-text search for chunks
  # containing all rare terms of the question (terms in more than
  # lexical_max_doc_fraction of the chunks are ignored). Chosen on the golden
  # set, see docs/evaluation_report.md. rrf_k is the usual fusion constant.
  hybrid_search: true
  lexical_max_doc_fraction: 0.10
  rrf_k: 60
  # Cross-encoder over the merged candidates, about 1.8 s per question on the CPU.
  # Measured in docs/evaluation_report.md, section 11.
  rerank: true
  rerank_model: "cross-encoder/ms-marco-MiniLM-L-6-v2"
  max_chunks_per_paper: 3
  # Cosine-similarity gates (calibrated on the test questions, see README):
  # below min_similarity nothing is sent to Claude ("insufficient evidence");
  # below weak_similarity the evidence is flagged as weak in the prompt.
  min_similarity: 0.30
  weak_similarity: 0.45
  # Sections that rarely contain findings (title page, affiliations).
  exclude_sections: ["Front Matter"]
  # Previous turns given to Claude as context for follow-up questions.
  history_turns: 3
  # A citation quote must contain at least this many words.
  min_quote_words: 5

web:
  # Chat questions per minute from one client address.
  rate_limit_per_minute: 10
  # Questions answered at the same time; further ones get "busy" (HTTP 503)
  # instead of queueing behind a slow local model.
  max_concurrent_requests: 2
  # Follow-up context is kept in memory, dropped when idle or when full.
  max_conversations: 1000
  conversation_ttl_minutes: 60

spark:
  # local[*] = one JVM using all CPU cores of this machine (NOT a cluster).
  master: "local[*]"
  # Data lake root. The name "namenode" resolves only inside the Compose network,
  # so jobs that use HDFS run in the app container (see README).
  lake_root: "hdfs://namenode:8020/cyberresearch"
  hdfs_replication: 2
  driver_memory: "2g"
  shuffle_partitions: 8

streaming:
  # The name "kafka" resolves only inside the Compose network.
  bootstrap_servers: "kafka:9092"
  topic: "papers.raw"
  # Upper limit of one micro-batch, which is collected in the driver to embed it.
  max_offsets_per_trigger: 200
  trigger_seconds: 30

logging:
  directory: "logs"
  file_name: "ingestion.log"
