# Claude Code on GitHub: mention @claude in an issue, PR comment or review and
# Claude answers (and can push commits) as the claude[bot] account.
#
# Requirements (done once by the repository owner):
#   1. Claude GitHub App installed for this repository
#      (https://github.com/apps/claude).
#   2. ONE of these repository secrets (Settings > Secrets and variables > Actions):
#      - CLAUDE_CODE_OAUTH_TOKEN : Claude Pro/Max subscription token
#                                  (create it with `claude setup-token`)
#      - ANTHROPIC_API_KEY       : Anthropic API key (pay per use)
#
# GitHub runs issue/comment workflows from the DEFAULT branch (main), so this
# file only takes effect after it has been merged into main.

name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened, assigned]

jobs:
  claude:
    # Run only when @claude is mentioned AND the author is the owner or a
    # collaborator, so nobody else can spend this repository's Claude quota.
    if: |
      (github.event_name == 'issue_comment'
        && contains(github.event.comment.body, '@claude')
        && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) ||
      (github.event_name == 'pull_request_review_comment'
        && contains(github.event.comment.body, '@claude')
        && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) ||
      (github.event_name == 'pull_request_review'
        && contains(github.event.review.body, '@claude')
        && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.review.author_association)) ||
      (github.event_name == 'issues'
        && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude'))
        && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The workflow token stays read-only; Claude writes through the Claude
    # GitHub App token, obtained via OIDC (id-token).
    permissions:
      contents: read
      pull-requests: read
      issues: read
      actions: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code
        uses: anthropics/claude-code-action@v1
        with:
          # Set only ONE of these two secrets; the unset one is empty.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # Lets Claude read CI results when asked to fix failing checks.
          additional_permissions: |
            actions: read
